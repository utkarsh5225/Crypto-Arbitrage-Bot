kind = "web"
previewPath = "/"
title = "Arbitrage Bot Dashboard"
version = "1.0.0"
id = "artifacts/arb-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18467

[services.development]
run = "pnpm --filter @workspace/arb-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arb-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/arb-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18467"
BASE_PATH = "/"
