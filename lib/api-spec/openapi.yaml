openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Triangular Arbitrage Bot API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: config
    description: Bot configuration
  - name: opportunities
    description: Arbitrage opportunity history
  - name: trades
    description: Trade history
  - name: stats
    description: Aggregated statistics
  - name: stream
    description: Server-sent events stream
  - name: account
    description: Live Binance account data
  - name: bot
    description: Bot control operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /config:
    get:
      operationId: getConfig
      tags: [config]
      summary: Get bot configuration
      description: Returns current fee rate and minimum profit threshold
      responses:
        "200":
          description: Current configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfig"
    put:
      operationId: updateConfig
      tags: [config]
      summary: Update bot configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotConfigInput"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfig"

  /config/credentials:
    get:
      operationId: getCredentials
      tags: [config]
      summary: Get Binance API credential status
      description: Returns whether credentials are configured; never returns the actual key/secret values
      responses:
        "200":
          description: Credential status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsStatus"
    post:
      operationId: setCredentials
      tags: [config]
      summary: Save Binance API credentials
      description: Stores the API key and secret securely on the server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsInput"
      responses:
        "200":
          description: Credential status after saving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsStatus"

  /opportunities:
    get:
      operationId: getOpportunities
      tags: [opportunities]
      summary: Get recent arbitrage opportunities
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Max number of opportunities to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Pagination offset
      responses:
        "200":
          description: List of recent opportunities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunitiesResponse"

  /trades:
    get:
      operationId: getTrades
      tags: [trades]
      summary: Get trade history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Max number of trades to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Pagination offset
      responses:
        "200":
          description: List of trades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradesResponse"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get aggregated bot statistics
      responses:
        "200":
          description: Bot statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStats"

  /stream:
    get:
      operationId: getStream
      tags: [stream]
      summary: SSE stream for real-time updates
      description: Server-sent events stream delivering opportunity, trade, stats, and scanner_status events
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /account/balances:
    get:
      operationId: getAccountBalances
      tags: [account]
      summary: Get Binance account balances
      description: Returns non-zero asset balances from the Binance account. Requires credentials and live mode.
      responses:
        "200":
          description: Account balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalancesResponse"
        "403":
          description: Credentials not configured or not in live mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /account/orders:
    get:
      operationId: getAccountOrders
      tags: [account]
      summary: Get recent bot-placed orders
      description: Returns the last 20 real orders placed by the bot. Requires credentials and live mode.
      responses:
        "200":
          description: Recent bot orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveOrdersResponse"
        "403":
          description: Credentials not configured or not in live mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bot/kill:
    post:
      operationId: killBot
      tags: [bot]
      summary: Emergency kill switch — revert to paper mode immediately
      responses:
        "200":
          description: Bot reverted to paper mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillSwitchResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    BotConfig:
      type: object
      properties:
        feeRate:
          type: number
          description: Fee per trade leg as a decimal (e.g. 0.001 = 0.1%)
        minProfitThreshold:
          type: number
          description: Minimum net profit % to trigger trade (e.g. 0.001 = 0.1%)
        notionalSize:
          type: number
          description: Fixed notional trade size in USDT
        tradingMode:
          type: string
          enum: [paper, live]
          description: Whether to paper-trade or execute real orders on Binance
        maxNotionalPerTrade:
          type: number
          description: Maximum USDT notional per live trade (safety cap)
        dailyLossLimitUsd:
          type: number
          description: Revert to paper mode if realised daily loss exceeds this value
        dailyLossUsd:
          type: number
          description: Current day realised loss in USD (read-only, set by server)
        useTestnet:
          type: boolean
          description: Route live orders and account calls to Binance Spot Testnet (fake funds) instead of production
      required:
        - feeRate
        - minProfitThreshold
        - notionalSize
        - tradingMode
        - maxNotionalPerTrade
        - dailyLossLimitUsd
        - dailyLossUsd
        - useTestnet

    BotConfigInput:
      type: object
      properties:
        feeRate:
          type: number
        minProfitThreshold:
          type: number
        notionalSize:
          type: number
        tradingMode:
          type: string
          enum: [paper, live]
        maxNotionalPerTrade:
          type: number
        dailyLossLimitUsd:
          type: number
        useTestnet:
          type: boolean

    CredentialsInput:
      type: object
      properties:
        apiKey:
          type: string
          description: Binance API key
        apiSecret:
          type: string
          description: Binance API secret
      required:
        - apiKey
        - apiSecret

    CredentialsStatus:
      type: object
      properties:
        configured:
          type: boolean
          description: Whether credentials are currently set
        maskedKey:
          type: string
          description: Masked API key for display (first 4 + last 4 chars only)
      required:
        - configured

    ArbitrageOpportunity:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: array
          items:
            type: string
          description: Symbols in the triangle path e.g. ["USDT","BTC","ETH","USDT"]
        symbols:
          type: array
          items:
            type: string
          description: Trading pair symbols used e.g. ["BTCUSDT","ETHBTC","ETHUSDT"]
        prices:
          type: array
          items:
            type: number
          description: Prices used for each leg
        grossProfitPct:
          type: number
          description: Gross profit percentage before fees
        netProfitPct:
          type: number
          description: Net profit percentage after fees
        wasPaperTraded:
          type: boolean
      required:
        - id
        - timestamp
        - path
        - symbols
        - prices
        - grossProfitPct
        - netProfitPct
        - wasPaperTraded

    OpportunitiesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ArbitrageOpportunity"
        total:
          type: integer
      required:
        - data
        - total

    PaperTrade:
      type: object
      properties:
        id:
          type: string
        opportunityId:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: array
          items:
            type: string
        symbols:
          type: array
          items:
            type: string
        prices:
          type: array
          items:
            type: number
        notionalSize:
          type: number
        grossProfitUsd:
          type: number
        netProfitUsd:
          type: number
        netProfitPct:
          type: number
        mode:
          type: string
          enum: [paper, live]
          description: Whether this was a simulated or real executed trade
        orderIds:
          type: array
          items:
            type: integer
          description: Binance order IDs for each leg (live trades only)
        fillPrices:
          type: array
          items:
            type: number
          description: Actual fill prices from Binance for each leg (live trades only)
      required:
        - id
        - opportunityId
        - timestamp
        - path
        - symbols
        - prices
        - notionalSize
        - grossProfitUsd
        - netProfitUsd
        - netProfitPct

    TradesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PaperTrade"
        total:
          type: integer
      required:
        - data
        - total

    AccountBalance:
      type: object
      properties:
        asset:
          type: string
        free:
          type: number
          description: Available balance
        locked:
          type: number
          description: Balance locked in open orders
        usdtValue:
          type: number
          description: Estimated value in USDT (if price data available)
      required:
        - asset
        - free
        - locked

    AccountBalancesResponse:
      type: object
      properties:
        balances:
          type: array
          items:
            $ref: "#/components/schemas/AccountBalance"
        totalUsdtValue:
          type: number
          description: Sum of estimated USDT values for all non-zero assets
        updatedAt:
          type: string
          format: date-time
      required:
        - balances
        - totalUsdtValue
        - updatedAt

    LiveOrder:
      type: object
      properties:
        orderId:
          type: integer
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        executedQty:
          type: number
        avgPrice:
          type: number
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        leg:
          type: integer
          description: Which leg of the triangle this order was (1, 2, or 3)
        trianglePath:
          type: string
          description: Human-readable triangle path, e.g. USDT→BTC→ETH→USDT
      required:
        - orderId
        - symbol
        - side
        - executedQty
        - avgPrice
        - status
        - timestamp

    LiveOrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/LiveOrder"
      required:
        - orders

    KillSwitchResponse:
      type: object
      properties:
        tradingMode:
          type: string
        message:
          type: string
      required:
        - tradingMode
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    TopOpportunity:
      type: object
      description: A compact snapshot of a triangle's best evaluation result
      properties:
        path:
          type: array
          items:
            type: string
          description: Currency path e.g. ["USDT","BTC","ETH","USDT"]
        symbols:
          type: array
          items:
            type: string
          description: Trading pair symbols for each leg
        grossProfitPct:
          type: number
          description: Gross profit as a decimal before fees
        netProfitPct:
          type: number
          description: Net profit as a decimal after fees
        timestamp:
          type: string
          format: date-time
      required:
        - path
        - symbols
        - grossProfitPct
        - netProfitPct
        - timestamp

    BotStats:
      type: object
      properties:
        totalOpportunities:
          type: integer
          description: Total opportunities detected since start
        totalTrades:
          type: integer
          description: Total trades executed
        totalProfitUsd:
          type: number
          description: Cumulative net P&L in USD
        winRate:
          type: number
          description: Fraction of trades that were profitable
        pairsTracked:
          type: integer
          description: Number of trading pairs in the price map
        pathsEvaluated:
          type: integer
          description: Total triangle paths evaluated since start
        pathsPerSecond:
          type: number
          description: Moving average of paths evaluated per second
        scannerConnected:
          type: boolean
          description: Whether the Binance WebSocket is connected
        uptimeSeconds:
          type: number
          description: Seconds since the scanner started
        opportunitiesPerMinute:
          type: number
          description: Moving average of opportunities found per minute
        topScan:
          type: array
          items:
            $ref: "#/components/schemas/TopOpportunity"
          description: Top 5 triangles from the most recent 2-second scan window
        topToday:
          type: array
          items:
            $ref: "#/components/schemas/TopOpportunity"
          description: Top 5 best triangles seen today (since server start), by net profit
        tradingMode:
          type: string
          enum: [paper, live]
          description: Current trading mode
        dailyLossUsd:
          type: number
          description: Current day realised loss in USD
      required:
        - totalOpportunities
        - totalTrades
        - totalProfitUsd
        - winRate
        - pairsTracked
        - pathsEvaluated
        - pathsPerSecond
        - scannerConnected
        - uptimeSeconds
        - opportunitiesPerMinute
        - topScan
        - topToday
        - tradingMode
        - dailyLossUsd
